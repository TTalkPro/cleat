# PR 层 CI（cleat-162，designs/29 §4）：build + Core 全量 + Host 的 Host / Packages 分类，
# 目标 ≤ 15 min。确定性守卫（G5，cleat-182 取代种子守卫）：从零两步编出的镜像与 dotnet build 的逐字节相同、
# src/boot 是不动点。性能不进 CI（29 §9）。
name: pr

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Build.props', 'Directory.Solution.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (Release)
        run: dotnet build Cleat.slnx -c Release -v quiet -nologo

      - name: Test Core (full)
        run: dotnet test tests/Cleat.Core.Tests -c Release -v quiet -nologo --logger trx

      - name: Test Compiler (full)
        run: dotnet test tests/Cleat.Compiler.Tests -c Release -v quiet -nologo --logger trx

      - name: Determinism guard (G5, Category=Determinism)
        run: dotnet test tests/Cleat.Host.Tests -c Release -v quiet -nologo --filter "Category=Determinism" --logger trx

      - name: Test Host (Category=Host|Packages)
        run: dotnet test tests/Cleat.Host.Tests -c Release -v quiet -nologo --filter "Category=Host|Category=Packages" --logger trx

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/Cleat.Core.Tests/TestResults/
            tests/Cleat.Host.Tests/TestResults/
          if-no-files-found: ignore
